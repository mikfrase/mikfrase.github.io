<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Council Dashboard</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #111827;
    --border: rgba(148,163,184,0.16);
    --text: #e5e7eb;
    --muted: #94a3b8;
    --accent: #22c55e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #0b1220 0%, #111827 100%);
    color: var(--text);
  }

  .wrap {
    max-width: 1500px;
    margin: 0 auto;
    padding: 28px 18px 40px;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    margin: 0 0 8px 0;
    font-size: 36px;
    line-height: 1.15;
  }

  .header p {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
  }

  .panel {
    background: rgba(17,24,39,0.95);
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.30);
  }

  .panel-head {
    padding: 18px 20px 12px;
    border-bottom: 1px solid rgba(148,163,184,0.10);
  }

  .panel-title {
    margin: 0 0 4px 0;
    font-size: 22px;
    font-weight: 700;
  }

  .panel-sub {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  iframe {
    display: block;
    width: 100%;
    height: 980px;
    border: 0;
    background: white;
  }

  .footer {
    margin-top: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 1100px) {
    .grid {
      grid-template-columns: 1fr;
    }

    iframe {
      height: 900px;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Council Dashboard</h1>
      <p>Form submission and membership performance gauges</p>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Council 1728 Form Submission</h2>
          <p class="panel-sub">Dashboard view of form receipt activity</p>
        </div>
        <iframe src="Council_1728_Form_Submission_Gauge_v3.html" title="Council 1728 Form Submission Gauge"></iframe>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Council Membership Performance</h2>
          <p class="panel-sub">Dashboard view of Column L membership quota performance</p>
        </div>
        <iframe src="Council_Membership_Performance_Gauge.html" title="Council Membership Performance Gauge"></iframe>
      </section>
    </div>

    <div class="footer">
      Keep this file in the same folder as the two gauge HTML files.
    </div>
  </div>
</body>
</html>
