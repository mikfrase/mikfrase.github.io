<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2340" />

  <title>Wisconsin Knights of Columbus — State Directory</title>
  <style>
    /* ============================================================
       FORMAT TOKENS — change these to restyle the directory
       ============================================================ */
    :root {
      --navy: #0b2340;
      --navy-2: #16385c;
      --navy-3: #1e4a73;
      --cream: #f3eee3;
      --paper: #fffcf7;
      --card: #ffffff;
      --ink: #1a1714;
      --muted: #6a6258;
      --faint: #8a8276;
      --line: #ddd4c6;
      --line-strong: #c9bead;
      --cardinal: #8a1f24;
      --open: #8a5a2b;
      --ok: #2c5e3a;
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --pad: 16px;
      --max: 720px;
      --header-h: auto;
      --font-display: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --font-body: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --shadow: 0 1px 2px rgba(11, 35, 64, 0.06), 0 8px 24px rgba(11, 35, 64, 0.06);
      --tap: 44px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--ink);
      line-height: 1.45;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    button, [role="button"], a.act { cursor: pointer; touch-action: manipulation; }
    a { color: var(--navy-2); }

    .app {
      max-width: var(--max);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Header ---- */
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--navy);
      color: var(--cream);
      padding: calc(10px + var(--safe-t)) var(--pad) 12px;
      box-shadow: 0 8px 24px rgba(11, 35, 64, 0.28);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .emblem {
      width: 40px;
      height: 48px;
      flex: 0 0 auto;
    }
    .brand h1 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.15;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: color-mix(in oklab, var(--cream) 72%, transparent);
      font-weight: 600;
    }
    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.55;
      pointer-events: none;
    }
    #q {
      width: 100%;
      height: var(--tap);
      border: 0;
      border-radius: 999px;
      padding: 0 44px 0 42px;
      font-size: 16px; /* prevent iOS zoom */
      font-family: inherit;
      background: var(--paper);
      color: var(--ink);
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    #q::placeholder { color: var(--faint); }
    #q:focus { box-shadow: 0 0 0 3px color-mix(in oklab, var(--cream) 35%, transparent); }
    #clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
    }
    #clear.show { display: flex; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 0;
      padding: 0;
    }
    .chip {
      flex: 0 0 auto;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid color-mix(in oklab, var(--cream) 22%, transparent);
      background: transparent;
      color: var(--cream);
      font: 600 0.76rem var(--font-body);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .chip[aria-pressed="true"] {
      background: var(--cream);
      color: var(--navy);
      border-color: var(--cream);
    }

    /* ---- Meta bar ---- */
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px var(--pad) 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .meta strong { color: var(--ink); font-weight: 650; }

    /* ---- Content ---- */
    main {
      flex: 1;
      padding: 10px var(--pad) calc(28px + var(--safe-b));
    }

    .group {
      margin: 18px 0 10px;
    }
    .group-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      margin: 0 0 8px;
      color: var(--navy);
      letter-spacing: -0.02em;
    }
    .group-sub {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      margin: 16px 0 8px;
    }

    details.block {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    details.block > summary {
      list-style: none;
      cursor: pointer;
      min-height: var(--tap);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      font-weight: 650;
      color: var(--navy);
    }
    details.block > summary::-webkit-details-marker { display: none; }
    details.block > summary .chev {
      width: 18px; height: 18px; flex: 0 0 auto;
      opacity: 0.55;
      transition: transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    details.block[open] > summary .chev { transform: rotate(90deg); }
    details.block .inner { padding: 0 10px 10px; }

    /* ---- Cards ---- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 12px 14px 10px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .card.open-seat {
      background: color-mix(in oklab, var(--cream) 55%, white);
      border-style: dashed;
    }
    .card-kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--navy);
      color: var(--cream);
    }
    .badge.gk { background: var(--navy); }
    .badge.fs { background: var(--navy-3); }
    .badge.dd { background: var(--cardinal); }
    .badge.dw { background: #5c3d2e; }
    .badge.fn { background: #1f4d45; }
    .badge.fc { background: #2f4d63; }
    .badge.open { background: var(--open); }
    .badge.muted {
      background: color-mix(in oklab, var(--navy) 10%, white);
      color: var(--navy);
    }
    .name {
      font-family: var(--font-display);
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 2px;
      line-height: 1.2;
    }
    .role-line {
      font-size: 0.92rem;
      color: var(--navy-2);
      font-weight: 600;
      margin: 0 0 2px;
    }
    .org {
      font-size: 0.86rem;
      color: var(--muted);
      margin: 0;
    }
    .roles-extra {
      margin: 8px 0 0;
      padding: 8px 0 0;
      border-top: 1px solid var(--line);
    }
    .roles-extra .role-line { font-size: 0.86rem; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .act {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--cream);
      color: var(--navy);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 650;
    }
    .act svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .act.call { background: var(--navy); color: var(--cream); border-color: var(--navy); }

    .addr {
      margin: 8px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    mark {
      background: color-mix(in oklab, #e4c36a 55%, white);
      color: inherit;
      padding: 0 1px;
      border-radius: 2px;
    }

    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .empty h2 {
      font-family: var(--font-display);
      color: var(--navy);
      margin: 0 0 8px;
      font-size: 1.3rem;
    }
    .hint {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 16px 16px 8px;
      box-shadow: var(--shadow);
    }
    .hint h2 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin: 0 0 6px;
      color: var(--navy);
    }
    .hint p { margin: 0 0 12px; color: var(--muted); font-size: 0.92rem; }
    .shortcuts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0 12px;
    }
    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-height: var(--tap);
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--cream);
      color: var(--navy);
      text-align: left;
      font-family: inherit;
    }
    .shortcut b { font-size: 0.88rem; }
    .shortcut span { font-size: 0.72rem; color: var(--muted); }

    footer {
      padding: 8px var(--pad) calc(16px + var(--safe-b));
      text-align: center;
      color: var(--faint);
      font-size: 0.72rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

    function orgLine(r) {
      const bits = [];
      if (r.council) bits.push("Council " + r.council + (r.councilName ? " · " + r.councilName : r.councilCity ? " · " + r.councilCity : ""));
      if (r.assembly) {
        bits.push((r.assemblyName || "Assembly") + (r.assembly ? " #" + r.assembly : ""));
      }
      if (r.district && (r.roleCode === "DD" || r.roleCode === "DW" || r.category === "council" || r.category === "district")) {
        bits.push("District " + r.district);
      }
      if (r.diocese) bits.push(r.diocese + " Diocese");
      if (r.assemblyArea && !bits.length) bits.push(r.assemblyArea + " District");
      return bits.join(" · ");
    }

    function fullAddress(r) {
      return [r.address, [r.city, r.state].filter(Boolean).join(", "), r.zip].filter(Boolean).join(" ");

    function telHref(p) {
      const d = p.replace(/[^\d+]/g, "");
      return "tel:" + (d.length === 10 ? "+1" + d : d);
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (ch) {
        if (ch === "&") return "\u0026amp;";
        if (ch === "<") return "\u0026lt;";
        if (ch === ">") return "\u0026gt;";
        if (ch === '"') return "\u0026quot;";
        return "\u0026#39;";
      });
    }

    function highlight(text, tokens) {
      if (!tokens.length || !text) return esc(text);
      let out = esc(text);
      tokens.forEach((t) => {
        if (t.length < 2) return;
        const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
        out = out.replace(re, "<mark>$1</mark>");
      });
      return out;
    }

    function actionsHtml(r) {

        parts.push('<a class="act" href="' + telHref(r.home) + '">' + ICONS.phone + "Home " + esc(r.home) + "</a>");
      }
      if (r.email) parts.push('<a class="act" href="mailto:' + esc(r.email) + '">' + ICONS.mail + esc(r.email) + "</a>");

      if (addr) {
        parts.push(
          '<a class="act" target="_blank" rel="noopener" href="https://maps.google.com/?q=' +
            encodeURIComponent(addr) + '">' + ICONS.pin + "Map</a>"
        );
      }
      return parts.length ? '<div class="actions">' + parts.join("") + "</div>" : "";
    }

                highlight(x.role, tokens) +
                "</p><p class=\"org\">" +
                highlight(orgLine(x) || x.section, tokens) +
                "</p>"
              );
            })
            .join("") +
          "</div>";
      }
      const addr = fullAddress(r);
      const kicker = r.vacant
        ? '<div class="card-kicker"><span class="badge open">Open</span></div>'
        : "";
      return (
        '<article class="card' +
        (r.vacant ? " open-seat" : "") +
        '">' +
        kicker +
        '<h3 class="name">' +
        highlight(r.name, tokens) +
        "</h3>" +
        '<p class="role-line">' +
        highlight(r.role, tokens) +
        "</p>" +
        (org ? '<p class="org">' + highlight(org, tokens) + "</p>" : "") +
        extra +
        (addr && !r.vacant ? '<p class="addr">' + highlight(addr, tokens) + "</p>" : "") +
        actionsHtml(r) +
        "</article>"
      );
    }

    function compactCard(r, tokens) {
      return cardHtml(r, [], tokens);
    }

    function matchesFilter(r) {
      if (filter === "all") return true;
      if (filter === "state") return r.category === "state";
      if (filter === "councils") return r.category === "council" || r.category === "district";
      if (filter === "assembly") return r.category === "assembly";
      if (filter === "agent") return r.category === "agent";
      if (filter === "past") return r.category === "past";
      if (filter === "open") return r.vacant;
      return r.diocese === filter;
    }

    function tokensOf(q) {
      return q.toLowerCase().split(/\s+/).filter(Boolean);
    }

    function searchList(q, includeOpen) {
      const tokens = tokensOf(q);
      return listings.filter((r) => {
        if (!includeOpen && r.vacant && !tokens.length) return false;
        if (!matchesFilter(r)) return false;
        if (!tokens.length) return true;
        return tokens.every((t) => r._search.includes(t));
      });
    }

    function groupPeople(rows) {
      const map = new Map();
      rows.forEach((r) => {
        const k = personKey(r);
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(r);
      });
      const groups = [];
      map.forEach((arr) => {
        arr.sort((a, b) => a.sort - b.sort || a.role.localeCompare(b.role));
        groups.push(arr);
      });
      groups.sort((a, b) => a[0].last.localeCompare(b[0].last) || a[0].name.localeCompare(b[0].name));
      return groups;
    }

    function renderChips() {
      chipsEl.innerHTML = FILTERS.map(
        (f) =>
          '<button type="button" class="chip" data-id="' +
          esc(f.id) +
          '" aria-pressed="' +
          (filter === f.id) +
          '">' +
          esc(f.label) +
          "</button>"
      ).join("");
    }

    function details(title, body, open) {
      return (
        '<details class="block"' +
        (open ? " open" : "") +
        "><summary><span>" +
        esc(title) +
        "</span>" +
        ICONS.chev +
        "</summary><div class=\"inner\">" +
        body +
        "</div></details>"
      );
    }

    function browseCouncils(diocese) {
      const rows = listings.filter(
        (r) => (r.category === "council" || r.category === "district") && (!diocese || r.diocese === diocese)
      );
      const byDiocese = {};
      rows.forEach((r) => {
        (byDiocese[r.diocese] || (byDiocese[r.diocese] = [])).push(r);
      });
      const order = ["Green Bay", "La Crosse", "Madison", "Milwaukee", "Superior"];
      const dioceses = order.filter((d) => byDiocese[d]);
      const one = diocese && dioceses.length === 1;
      return dioceses
        .map((d) => {
          const all = byDiocese[d];
          const byDist = {};
          all.forEach((r) => {
            (byDist[r.district] || (byDist[r.district] = [])).push(r);
          });
          const dists = Object.keys(byDist).sort((a, b) => Number(a) - Number(b));
          const inner = dists
            .map((dist) => {
              const items = byDist[dist];
              const dds = items.filter((x) => x.roleCode === "DD");
              const dws = items.filter((x) => x.roleCode === "DW");
              const rest = items.filter((x) => x.roleCode !== "DD" && x.roleCode !== "DW");
              const byCouncil = {};
              rest.forEach((r) => {
                (byCouncil[r.council] || (byCouncil[r.council] = [])).push(r);
              });
              const cnums = Object.keys(byCouncil).sort((a, b) => Number(a) - Number(b));
              let html = dds.concat(dws).map((x) => compactCard(x, [])).join("");
              html += cnums
                .map((n) => {
                  const officers = byCouncil[n].sort((a, b) => a.sort - b.sort);
                  const label =
                    "Council " + n + " · " + (officers[0].councilName || officers[0].councilCity || "");
                  return (
                    '<p class="group-sub">' +
                    esc(label) +
                    "</p>" +
                    officers.map((o) => compactCard(o, [])).join("")
                  );
                })
                .join("");
              return details("District " + dist, html, dists.length <= 3);
            })
            .join("");
          if (one) {
            return '<div class="group"><h2 class="group-title">' + esc(d) + " Diocese</h2>" + inner + "</div>";
          }
          return details(d + " Diocese", inner, false);
        })
        .join("");
    }

    function browseSections(rows, sectionOrder) {
      const by = {};
      rows.forEach((r) => {
        (by[r.section] || (by[r.section] = [])).push(r);
      });
      const keys = sectionOrder.filter((s) => by[s]).concat(Object.keys(by).filter((s) => !sectionOrder.includes(s)).sort());
      return keys
        .map((s) => {
          const people = groupPeople(by[s]);
          const body = people.map((arr) => cardHtml(arr[0], arr, [])).join("");
          return details(s + " · " + people.length, body, keys.length <= 2);
        })
        .join("");
    }

    function home() {
      const officers = listings.filter((r) => r.section === "State Officers" && !r.vacant);
      officers.sort((a, b) => a.sort - b.sort);
      return (
        '<div class="hint">' +
        "<h2>Find a brother knight</h2>" +
        "<p>Search by name, city, council number, district, email, or role. Tap a number to call.</p>" +
        '<div class="shortcuts">' +
        '<button class="shortcut" data-jump="state"><b>State officers</b><span>Deputy, board, chaplain</span></button>' +
        '<button class="shortcut" data-jump="councils"><b>Councils</b><span>Five dioceses</span></button>' +
        '<button class="shortcut" data-jump="assembly"><b>4th Degree</b><span>Assemblies & officers</span></button>' +
        '<button class="shortcut" data-jump="agent"><b>Field agents</b><span>Northern & Southern</span></button>' +
        "</div></div>" +
        '<div class="group"><h2 class="group-title">State Officers</h2>' +
        officers.map((r) => compactCard(r, [])).join("") +
        "</div>"
      );
    }

    function render() {
      const q = query.trim();
      clearBtn.classList.toggle("show", q.length > 0);
      const tokens = tokensOf(q);

      if (!q && filter === "all") {
        countEl.innerHTML = "<strong>" + listings.filter((r) => !r.vacant).length + "</strong> listings";
        main.innerHTML = home();
        return;
      }

      if (!q && filter === "councils") {
        const n = listings.filter((r) => (r.category === "council" || r.category === "district") && !r.vacant).length;
        countEl.innerHTML = "<strong>" + n + "</strong> council & district roles";
        main.innerHTML = browseCouncils();
        return;
      }

      if (!q && ["Green Bay", "La Crosse", "Madison", "Milwaukee", "Superior"].includes(filter)) {
        const n = listings.filter((r) => r.diocese === filter && !r.vacant).length;
        countEl.innerHTML = "<strong>" + n + "</strong> in " + esc(filter);
        main.innerHTML = browseCouncils(filter);
        return;
      }

      if (!q && filter === "state") {
        const rows = listings.filter((r) => r.category === "state");
        const filled = rows.filter((r) => !r.vacant).length;
        const open = rows.filter((r) => r.vacant).length;
        countEl.innerHTML =
          "<strong>" +
          filled +
          "</strong> state roles" +
          (open ? " · " + open + " open" : "");
        main.innerHTML = browseSections(rows, STATE_SECTIONS);
        return;
      }

      if (!q && filter === "open") {
        const rows = listings.filter((r) => r.vacant);
        countEl.innerHTML = "<strong>" + rows.length + "</strong> open seats";
        main.innerHTML = browseSections(rows, STATE_SECTIONS.concat([
          "Green Bay Diocese", "La Crosse Diocese", "Madison Diocese", "Milwaukee Diocese", "Superior Diocese",
        ]));
        return;
      }

      if (!q && filter === "assembly") {
        const rows = listings.filter((r) => r.category === "assembly");
        countEl.innerHTML = "<strong>" + rows.filter((r) => !r.vacant).length + "</strong> assembly roles";
        main.innerHTML = browseSections(rows, STATE_SECTIONS);
        return;
      }

      if (!q && (filter === "agent" || filter === "past")) {
        const rows = listings.filter((r) => r.category === filter && !r.vacant);
        countEl.innerHTML = "<strong>" + rows.length + "</strong>";
        main.innerHTML = browseSections(rows, [
          "Field Agents — Northern Wisconsin",
          "Field Agents — Southern Wisconsin",
          "Past State Deputies",
          "Former State Chaplains",
          "Former State Officers",
          "Former Masters — Eastern District",
          "Former Masters — Western District",
          "Former Vice Supreme Masters of Wisconsin",
          "Former Administrative Managers",
          "Wives of Deceased Past State Deputies",
        ]);
        return;
      }

      const rows = searchList(q, false);
      const groups = groupPeople(rows);
      countEl.innerHTML =
        "<strong>" + groups.length + "</strong> " + (groups.length === 1 ? "person" : "people");
      if (!groups.length) {
        main.innerHTML =
          '<div class="empty"><h2>No matches</h2><p>Try a last name, city, or council number such as 10919.</p></div>';
        return;
      }
      main.innerHTML = groups
        .slice(0, 200)
        .map((arr) => cardHtml(arr[0], arr, tokens))
        .join("") +
        (groups.length > 200
          ? '<p class="empty">Showing the first 200. Add another word to narrow the list.</p>'
          : "");
    }

    chipsEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-id]");
      if (!btn) return;
      filter = btn.getAttribute("data-id");
      renderChips();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    main.addEventListener("click", (e) => {
      const jump = e.target.closest("[data-jump]");
      if (!jump) return;
      filter = jump.getAttribute("data-jump");
      qEl.value = "";
      query = "";
      renderChips();
      render();
    });

    qEl.addEventListener("input", () => {
      query = qEl.value;
      render();
    });
    clearBtn.addEventListener("click", () => {
      qEl.value = "";
      query = "";
      qEl.focus();
      render();
    });

    renderChips();
    render();
  })();
  </script>
</body>
</html>
